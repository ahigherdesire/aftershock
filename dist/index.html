<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#233d6c"><meta name="description" content="An endless block puzzle with fast, gravity-flipping chain reactions. Place shapes, clear lines, and chase your best score."><title>Aftershock — Endless block puzzle</title><link rel="icon" href="icon.svg" type="image/svg+xml"><link rel="stylesheet" href="style.css"></head>
<body>
 <main class="app-shell">
  <header class="game-header"><h1>AFTERSHOCK</h1><div class="header-actions"><button id="sound" class="icon-button" aria-label="Turn sound on" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M11 5 6 9H3v6h3l5 4V5Z"/><path id="sound-waves" d="m16 9 5 6m0-6-5 6"/></svg></button><button id="help" class="icon-button" aria-label="How to play"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M9.5 9a2.5 2.5 0 1 1 3.6 2.25c-.9.5-1.1 1-1.1 2M12 17h.01"/></svg></button></div></header>
  <section class="game" aria-label="Aftershock game">
   <div class="score-row"><div class="score-best"><span><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m3 7 5 4 4-7 4 7 5-4-3 13H6Z"/></svg>Best</span><strong id="best">0</strong></div><div class="score-main"><span class="sr-only">Score</span><strong id="score">0</strong><span id="score-pop" aria-hidden="true"></span></div><button id="undo" class="icon-button" aria-label="Undo last placement" title="Undo last placement"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5 3 10l5 5M3 10h11a6 6 0 0 1 0 12"/></svg></button></div>
   <div class="board-toolbar"><div id="gravity-indicator" class="gravity-indicator"><svg id="gravity-arrow" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4v16m-6-6 6 6 6-6"/></svg><span id="gravity-state">Down</span><span class="sr-only">gravity</span></div><span id="mode-badge">Endless</span></div>
   <div class="board-frame"><div id="board" class="board" role="grid" aria-rowcount="8" aria-colcount="8" tabindex="0" aria-label="8 by 8 game board. Select a piece with 1, 2, or 3; use arrow keys and Space to place."><div id="background-grid" class="background-grid"></div><div id="tile-layer" class="tile-layer" aria-hidden="true"></div><div id="ghost-layer" class="ghost-layer" aria-hidden="true"></div><div id="effect-layer" class="effect-layer" aria-hidden="true"></div><div id="cursor" class="keyboard-cursor" hidden></div></div><div id="chain-banner" class="chain-banner" aria-hidden="true"><strong></strong><span></span></div></div>
   <div class="play-status" id="status" role="status">Drag blocks onto the board</div>
   <div class="tray" id="tray" aria-label="Available pieces"></div>
   <div class="game-bottom"><span id="pieces-left">3 shapes left</span><button id="new-game" class="text-button"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19 8a8 8 0 1 0 1 8M19 3v5h-5"/></svg>New game</button></div>
   <button id="leave-practice" class="practice-exit" hidden>Back to my game</button>
  </section>
 </main>
 <dialog id="modal"><button id="close-modal" class="close-modal icon-button" aria-label="Close dialog"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18"/></svg></button><div id="modal-content"></div></dialog><div id="drag-preview" class="drag-preview" aria-hidden="true" hidden></div>
 <script type="module" src="app.mjs"></script>
</body></html>
