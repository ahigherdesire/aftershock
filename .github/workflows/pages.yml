name: Test and publish Aftershock

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out the game
        uses: actions/checkout@v7.0.1
      - name: Test the game engine
        run: node --test tests/*.test.mjs
      - name: Check browser JavaScript
        run: |
          node --check dist/app.mjs
          node --check dist/engine.mjs
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6.0.0
      - name: Upload the playable game
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: dist
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v5.0.1
